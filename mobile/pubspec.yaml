name: fake_drug_checker
description: "AI-powered drug verification app for detecting counterfeit medications in Nigeria."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.4.0
  mobile_scanner: ^7.0.0
  shared_preferences: ^2.5.0
  google_fonts: ^6.2.1
  provider: ^6.1.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#F8FAFC"
    theme_color: "#0B6B48"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
